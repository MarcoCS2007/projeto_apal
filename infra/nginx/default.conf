upstream web_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Arquivos estáticos
    location /static/ {
        alias /app/staticfiles/;
    }

    # Arquivos de media (uploads)
    location /media/ {
        alias /app/media/;
    }

    # Proxy para o Gunicorn
    location / {
        proxy_pass http://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Tamanho máximo de upload (para anexos/documentos grandes)
    client_max_body_size 20M;
}
